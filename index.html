<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ЭмбриоLab">
<title>ЭмбриоLab — билеты</title>
<style>
:root{
  --bg:#0a101b;--panel:#111a2b;--panel2:#162136;--line:#26364e;--muted:#9bacbe;--txt:#f4f8ff;
  --accent:#a9dafa;--mint:#8ff0c4;--lime:#d0fa8a;--orange:#ffca91;--red:#ff919b;
  --okbg:#12352a;--badbg:#3a1820;--shadow:0 18px 60px #050b1599;--rad:20px;
  --glow1:#233d52;--glow2:#263045;--chip:#1a293c;
}
:root[data-theme="light"]{
  --bg:#f3f6fb;--panel:#ffffff;--panel2:#eef3fa;--line:#d6dfeb;--muted:#5c6b7e;--txt:#0f1a2a;
  --accent:#2a7bc0;--mint:#0f9d6b;--lime:#5f8f12;--orange:#c46a10;--red:#d23f4f;
  --okbg:#dcf5ea;--badbg:#fde3e6;--shadow:0 14px 40px #1b2a4018;--glow1:#d7ecfa;--glow2:#e5e8f7;--chip:#eef3fa;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);
  background:radial-gradient(ellipse 70% 35% at 12% -10%,var(--glow1) 0,transparent 80%),radial-gradient(ellipse 55% 30% at 95% 7%,var(--glow2) 0,transparent 78%),var(--bg);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shell{max-width:1180px;margin:auto;padding:22px 24px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:13px;align-items:center;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brandmark{background:linear-gradient(130deg,#d0ff9b,#83cefa);color:#101b27;display:grid;place-items:center;font-size:24px;font-weight:950;width:46px;height:46px;border-radius:15px}
.brandname{font-weight:840;font-size:19px;letter-spacing:-.6px}.brandname span{color:var(--mint)}
.micro,.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:780;color:var(--muted)}
.top-actions{display:flex;gap:10px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:9px 12px;min-height:42px}
.iconbtn:hover{border-color:var(--accent)}
.timerbox{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);padding:8px 13px;border-radius:14px;font-variant-numeric:tabular-nums;font-size:21px;font-weight:820}
.timerbox.warn{color:var(--red);border-color:var(--red)}
.hidden{display:none!important}

/* bank switch */
.switch{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px;margin-top:22px}
.switch button{border:0;background:none;border-radius:12px;padding:9px 18px;text-align:left;line-height:1.25}
.switch button b{display:block;font-size:15px}
.switch button span{font-size:12px;color:var(--muted)}
.switch button.on{background:linear-gradient(130deg,#bff59a,#8fd6fa);color:#0d1a26}
.switch button.on span{color:#24384a}

/* home */
.hero{padding:22px 0 20px;display:flex;gap:18px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;line-height:1.08;margin:7px 0 10px}
.hero h1 em{font-style:normal;color:var(--mint)}
.hero p{margin:0;color:var(--muted);max-width:620px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;letter-spacing:-1px}
.ring small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 26px}
.stat{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:14px 18px}
.stat b{display:block;font-size:26px;letter-spacing:-.8px}
.stat span{color:var(--muted);font-size:13px}
.track{height:5px;background:var(--panel2);border-radius:9px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .4s}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;font-weight:780;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec small{text-transform:none;letter-spacing:0;font-weight:500}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--rad);padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode .ico{font-size:22px;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);margin-bottom:4px}
.mode b{font-size:16px}
.mode span{color:var(--muted);font-size:13px}
.mode .n{margin-top:auto;padding-top:8px;font-size:12px;color:var(--mint);font-weight:700}
.mode.primary{background:linear-gradient(140deg,#1d3a3a,#152238);border-color:#2f5b55}
:root[data-theme="light"] .mode.primary{background:linear-gradient(140deg,#e2f7ee,#e6effb);border-color:#a8dcc6}
.mode:disabled{opacity:.45;cursor:not-allowed;transform:none}
.tickets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ticket{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;text-align:left;position:relative}
.ticket:hover{border-color:var(--accent)}
.ticket b{font-size:20px;display:block}
.ticket span{font-size:12px;color:var(--muted)}
.ticket.pass{border-color:color-mix(in srgb,var(--mint) 60%,transparent);background:color-mix(in srgb,var(--mint) 9%,var(--panel))}
.ticket.fail{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.ticket .res{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800}
.ticket.pass .res{color:var(--mint)}.ticket.fail .res{color:var(--red)}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.topic{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 16px;text-align:left}
.topic:hover{border-color:var(--accent)}
.topic .num{width:32px;height:32px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:800;flex:none}
.topic .tt{flex:1;min-width:0}
.topic .tt div{font-weight:650}
.topic .track{margin-top:6px}
.topic .pc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{margin-top:36px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.links{display:flex;gap:6px;flex-wrap:wrap}
.link{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:12px}
.link:hover{color:var(--txt);border-color:var(--accent)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.qhead h3{margin:0;font-size:20px;letter-spacing:-.4px}
.qhead .eyebrow{margin-bottom:2px}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{min-width:36px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.pill.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.pill.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--mint) 50%,transparent);color:var(--mint)}
.pill.bad{background:var(--badbg);border-color:color-mix(in srgb,var(--red) 50%,transparent);color:var(--red)}
.pill.done{background:var(--panel2);color:var(--accent)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:28px 30px;box-shadow:var(--shadow);position:relative}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.warn{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 45%,transparent)}
.tag.multi{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.star{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:3px 10px;color:var(--muted);font-size:13px}
.star.on{color:var(--lime);border-color:var(--lime)}
.question{font-size:clamp(19px,2.2vw,24px);font-weight:700;letter-spacing:-.4px;line-height:1.35;margin:0 0 22px}
.options{display:grid;gap:10px}
.option{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:14px 16px;transition:border-color .12s,background .12s}
.option:hover:not(:disabled){border-color:var(--accent)}
.option:disabled{cursor:default}
.optkey{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel);border:1px solid var(--line)}
.options.multi .optkey{border-radius:7px}
.option.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
.options.multi .option.sel .optkey{background:var(--accent);color:#0d1a26;border-color:var(--accent)}
.option.ok{border-color:var(--mint);background:var(--okbg)}
.option.ok .optkey{background:var(--mint);color:#0b1a14;border-color:var(--mint)}
.option.miss{border:1px dashed var(--mint)}
.option.miss .optkey{color:var(--mint);border-color:var(--mint)}
.option.bad{border-color:var(--red);background:var(--badbg)}
.option.bad .optkey{background:var(--red);color:#2a0b10;border-color:var(--red)}
.option.dim{opacity:.55}
.answerbox{margin-top:18px;border-radius:16px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--mint) 45%,transparent);background:color-mix(in srgb,var(--mint) 7%,var(--panel));animation:pop .35s ease-out}
.answerbox.bad{border-color:color-mix(in srgb,var(--orange) 45%,transparent);background:color-mix(in srgb,var(--orange) 6%,var(--panel))}
.praise{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.praise .em{font-size:32px;line-height:1;animation:bounce .6s ease-out}
.praise b{font-size:18px;color:var(--mint);display:block;line-height:1.25}
.answerbox.bad .praise b{color:var(--orange)}
.praise small{color:var(--muted);font-size:13px}
.answerbox p{margin:0 0 8px}
.memo{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--panel2);font-size:14px}
.memo b{color:var(--lime);white-space:nowrap}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:11px 18px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.main{background:linear-gradient(130deg,#bff59a,#8fd6fa);color:#0d1a26;border-color:transparent}
.btn.danger{color:var(--red)}
.hint{color:var(--muted);font-size:12px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:11px;background:var(--panel2)}
.progress{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:-4px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--accent));transition:width .3s}
.confetti{position:fixed;pointer-events:none;z-index:50;font-size:22px;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.1);opacity:0}}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:none;opacity:1}}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* result */
.result{text-align:center;padding:36px 20px 26px}
.result .big{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1}
.result .verdict{font-size:22px;font-weight:800;margin:10px 0 4px}
.result.pass .verdict,.result.pass .big{color:var(--mint)}
.result.fail .verdict,.result.fail .big{color:var(--orange)}
.result p{color:var(--muted);margin:0}
.result .cheer{color:var(--txt);margin-top:8px;font-size:16px}
.reslist{display:grid;gap:10px;margin-top:22px}
.resitem{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--panel)}
.resitem .q{font-weight:700;margin-bottom:6px}
.resitem .yours{color:var(--red);font-size:14px}
.resitem .right{color:var(--mint);font-size:14px}
.resitem .memo{font-size:13px}

/* cards */
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center}
.flash .question{margin-bottom:10px}
.flash .back{border-top:1px dashed var(--line);margin-top:18px;padding-top:18px;text-align:left}
.flash .back .ans{font-size:18px;font-weight:700;color:var(--mint);margin-bottom:8px}

/* bank */
.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.cheat{display:grid;grid-template-columns:200px 1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.cheat div{padding:11px 16px;border-bottom:1px solid var(--line)}
.cheat div:nth-last-child(-n+2){border-bottom:0}
.cheat .k{font-weight:750;background:var(--panel2)}
.bankitem{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--panel);margin-bottom:8px}
.bankitem summary{cursor:pointer;font-weight:650;list-style:none;display:flex;gap:10px}
.bankitem summary::-webkit-details-marker{display:none}
.bankitem summary .no{color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px}
.bankitem .body{margin-top:10px;padding-left:40px}
.bankitem .ans{color:var(--mint);font-weight:700;margin-bottom:4px}
.lvl{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px;background:var(--line)}
.lvl.l1{background:var(--orange)}.lvl.l2{background:var(--mint)}.lvl.l0{background:var(--red)}
mark{background:color-mix(in srgb,var(--lime) 40%,transparent);color:inherit;border-radius:3px}

@media (max-width:900px){.modes{grid-template-columns:repeat(2,1fr)}.tickets{grid-template-columns:repeat(4,1fr)}.topics{grid-template-columns:1fr}}
@media (max-width:620px){
  .shell{padding:16px 16px 50px}.summary{grid-template-columns:repeat(2,1fr)}
  .modes{grid-template-columns:1fr}.tickets{grid-template-columns:repeat(3,1fr)}
  .hero{flex-direction:column;align-items:flex-start}.card{padding:20px 18px}
  .cheat{grid-template-columns:1fr}.cheat .k{border-bottom:0}
  .switch{display:flex}.switch button{flex:1}
  .brandname+.micro{display:none}.themelabel{display:none}
  .bankitem .body{padding-left:0}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="brand" id="homeBtn" title="На главную">
      <div class="brandmark">Э</div>
      <div><div class="brandname">Эмбрио<span>Lab</span></div><div class="micro">Тренажёр · билеты · offline</div></div>
    </button>
    <div class="top-actions">
      <div class="timerbox hidden" id="timer">◷ <span id="timerVal">20:00</span></div>
      <button class="iconbtn" id="themeBtn" title="Сменить тему"><span id="themeIco">☀</span> <span class="themelabel" id="themeLbl">Светлая</span></button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
// База вопросов. Поля: n — номер, t — тема, q — вопрос, a — верный вариант,
// w — неверные варианты, e — развёрнутый ответ, m — «запомнить», d — спорный вопрос.
window.TOPICS = [
  "Дробление и гаструляция",
  "Мезодерма и органогенез",
  "Детерминация и индукция",
  "Гибель клеток и регенерация",
  "Потенции клеток и учёные",
  "Эмбриональная индукция",
  "Молекулярные механизмы"
];
const TF = ["Верно", "Неверно"];
window.QUESTIONS = [
// ───── 1. Дробление и гаструляция
{n:1,t:0,q:"Почему стадия получила название дробления?",a:"Зигота многократно делится на всё более мелкие бластомеры, а общий размер зародыша не растёт",w:["Зигота делится, и зародыш при этом быстро увеличивается в размерах","Клетки зародыша дробят запас желтка на мелкие гранулы","Зародыш распадается на несколько независимых частей"],e:"Потому что зигота многократно делится митозом на более мелкие клетки — бластомеры, при этом общий размер зародыша практически не увеличивается.",m:"Клеток больше, размер зародыша прежний."},
{n:2,t:0,q:"От каких факторов зависит тип дробления зиготы?",a:"От количества желтка и его распределения в цитоплазме",w:["От числа хромосом в ядре зиготы","От размера сперматозоида и места его проникновения","От температуры среды и скорости митоза"],e:"От количества желтка и его распределения в цитоплазме яйцеклетки.",m:"Чем больше желтка, тем сильнее он препятствует дроблению."},
{n:3,t:0,q:"Какой тип дробления характерен для зигот с малым количеством желтка?",a:"Полное равномерное (голобластическое)",w:["Полное неравномерное","Неполное дискоидальное (меробластическое)","Неполное поверхностное"],e:"Полное равномерное (голобластическое) дробление.",m:"Мало желтка — вся яйцеклетка делится равномерно."},
{n:4,t:0,q:"Какой тип дробления характерен для зигот со средним количеством желтка?",a:"Полное неравномерное",w:["Полное равномерное","Неполное дискоидальное","Неполное поверхностное"],e:"Полное неравномерное (голобластическое неравномерное) дробление.",m:"Вся яйцеклетка делится, но бластомеры получаются разного размера."},
{n:5,t:0,q:"Какой тип дробления характерен для зигот с большим количеством желтка?",a:"Неполное (меробластическое), обычно дискоидальное",w:["Полное равномерное","Полное неравномерное","Полное радиальное голобластическое"],e:"Неполное (меробластическое), обычно дискоидальное дробление.",m:"Много желтка — делится только небольшой участок цитоплазмы."},
{n:6,t:0,q:"На какой стадии дробления в клеточном цикле сохраняются только два периода (синтетический и митоз)?",a:"На ранних циклах дробления — G1 и G2 практически отсутствуют",w:["На поздних циклах, после перехода средней бластулы","Во время гаструляции","Во время нейруляции"],e:"На ранних циклах дробления. Клеточный цикл сокращён до S-фазы и митоза, фазы G1 и G2 практически отсутствуют.",m:"Раннее дробление: S + M."},
{n:7,t:0,q:"Какой элемент строения бластулы отсутствует у морулы?",a:"Бластоцель",w:["Бластодерма","Анимальный полюс","Бластомеры"],e:"Бластоцель — полость бластулы.",m:"Морула — плотный шар клеток без полости."},
{n:8,t:0,q:"В какой области бластулы располагается презумптивный зачаток мезодермы?",a:"В экваториальной (маргинальной) области",w:["В области анимального полюса","В области вегетативного полюса","В крыше бластоцеля"],e:"В экваториальной, или маргинальной, области.",m:"Мезодерма — середина."},
{n:9,t:0,q:"В какой области бластулы располагается презумптивный зачаток энтодермы?",a:"В области вегетативного полюса",w:["В области анимального полюса","В маргинальной (экваториальной) зоне","В крыше бластоцеля"],e:"В области вегетативного полюса.",m:"Энтодерма — низ."},
{n:10,t:0,q:"В какой области бластулы располагается презумптивный зачаток эктодермы?",a:"В области анимального полюса",w:["В области вегетативного полюса","В маргинальной (экваториальной) зоне","В дне бластоцеля"],e:"В области анимального полюса.",m:"Эктодерма — верх."},
{n:11,t:0,q:"Как называется тип дробления зигот Хордовых по форме и движению бластомеров?",a:"Радиальное",w:["Спиральное","Билатеральное","Дискоидальное"],e:"Радиальное дробление. Оно характерно, например, для ланцетника и амфибий.",m:"Радиальное — бластомеры располагаются ярусами."},
{n:12,t:0,q:"Как называется тип дробления зигот Моллюсков по форме и движению бластомеров?",a:"Спиральное",w:["Радиальное","Билатеральное","Поверхностное"],e:"Спиральное дробление.",m:"Моллюски — спираль."},
{n:13,t:0,q:"Как называется тип дробления зигот Круглых червей по форме и движению бластомеров?",a:"Билатеральное (двустороннее)",w:["Радиальное","Спиральное","Дискоидальное"],e:"Билатеральное (двустороннее) дробление.",m:"Билатеральное — формируется двусторонняя симметрия."},
{n:14,t:0,q:"Какая стадия развития наступает после стадии дробления?",a:"Бластула",w:["Гаструла","Нейрула","Органогенез"],e:"Бластула. После неё начинается гаструляция.",m:"Дробление → бластула → гаструла."},
{n:15,t:0,q:"Как называется процесс разделения тела зародыша на два зародышевых листка?",a:"Гаструляция",w:["Нейруляция","Дробление","Органогенез"],e:"Гаструляция.",m:"Гаструляция формирует зародышевые листки."},
{n:16,t:0,q:"Как называется процесс формирования третьего зародышевого листка у высших Хордовых?",a:"Мезодермообразование (мезодермогенез)",w:["Гаструляция","Нейруляция","Гистогенез"],e:"Мезодермообразование (мезодермогенез).",m:"Третий листок — мезодерма."},
{n:17,t:0,q:"Как называется способ гаструляции, при котором клетки энтодермы вселяются в бластоцель?",a:"Иммиграция (ингрессия)",w:["Инвагинация","Деламинация","Эпиболия"],e:"Иммиграция (ингрессия) — отдельные клетки перемещаются внутрь бластоцеля.",m:"Иммиграция — клетки мигрируют внутрь."},
{n:18,t:0,q:"Как называется способ гаструляции, при котором клетки вегетативного полюса впячиваются в бластоцель?",a:"Инвагинация",w:["Иммиграция","Деламинация","Эпиболия"],e:"Инвагинация.",m:"Инвагинация — впячивание."},
{n:19,t:0,q:"Как называется способ гаструляции, при котором клетки расслаиваются на два слоя?",a:"Деламинация",w:["Иммиграция","Инвагинация","Эпиболия"],e:"Деламинация.",m:"Деламинация — расслоение."},
{n:20,t:0,q:"Как называется способ гаструляции, при котором клетки крыши обрастают клетки дна бластулы?",a:"Эпиболия",w:["Иммиграция","Инвагинация","Деламинация"],e:"Эпиболия.",m:"Эпиболия — обрастание."},
// ───── 2. Мезодерма и органогенез
{n:21,t:1,q:"Как называется способ закладки мезодермы у спиральнодробящихся животных?",a:"Телобластический",w:["Энтероцельный","Иммиграционный","Через первичную полоску"],e:"Телобластический способ. Мезодерма образуется из специальных клеток — телобластов.",m:"Спиральное дробление — телобласты."},
{n:22,t:1,q:"Как называется способ закладки мезодермы у ланцетника?",a:"Энтероцельный",w:["Телобластический","Иммиграционный","Деламинационный"],e:"Энтероцельный способ — мезодерма образуется в виде выпячиваний стенки первичной кишки.",m:"Ланцетник — карманы архентерона."},
{n:23,t:1,q:"Как называется способ закладки мезодермы у амфибий?",a:"Иммиграционный — клетки маргинальной зоны перемещаются внутрь",w:["Энтероцельный — карманы первичной кишки","Телобластический — из клеток-телобластов","Деламинационный — расслоение эктодермы"],e:"Иммиграционный способ: клетки маргинальной зоны перемещаются внутрь зародыша.",m:"Амфибии — клетки мигрируют внутрь."},
{n:24,t:1,q:"Как называется способ закладки мезодермы у высших Хордовых?",a:"Миграция клеток эпибласта через первичную полоску",w:["Выпячивание стенок первичной кишки (энтероцельный)","Образование из клеток-телобластов","Расслоение гипобласта (деламинация)"],e:"Мезодерма формируется из клеток эпибласта, которые мигрируют через первичную полоску.",m:"Высшие хордовые — миграция через первичную полоску."},
{n:25,t:1,q:"Как называется период формирования органов тела зародыша?",a:"Органогенез",w:["Гистогенез","Гаструляция","Морфаллаксис"],e:"Органогенез.",m:"Органы — органогенез."},
{n:26,t:1,q:"Как называется процесс тканевого созревания органов тела зародыша?",a:"Гистогенез",w:["Органогенез","Нейруляция","Детерминация"],e:"Гистогенез — образование и дифференцировка тканей.",m:"Гисто = ткань."},
{n:27,t:1,q:"Какие структуры формируются на стадии ранней нейрулы?",a:"Нервная пластинка, борозда и валики; закладываются хорда и сомиты",w:["Замкнутая нервная трубка и закладки почек","Бластоцель и бластопор","Зачатки конечностей и сердце"],e:"Формируются нервная пластинка, нервная борозда и нервные валики; начинается образование нервной трубки, хорды и сомитов.",m:"Ранняя нейрула — начало формирования нервной трубки."},
{n:28,t:1,q:"Какие процессы происходят на стадии поздней нейрулы?",a:"Замыкание нервной трубки, разделение мезодермы, начало органогенеза",w:["Образование бластоцеля и морулы","Впячивание клеток вегетативного полюса","Синхронное дробление бластомеров"],e:"Замыкание нервной трубки, формирование хорды и сомитов, разделение мезодермы на отдельные области, начало органогенеза.",m:"Поздняя нейрула — нервная трубка закрывается."},
{n:29,t:1,q:"На какие части разделяется мезодерма на стадии поздней нейрулы?",a:"Осевая, параксиальная, промежуточная, латеральная",w:["Эктодерма, энтодерма, мезенхима","Склеротом, миотом, дерматом","Анимальная, маргинальная, вегетативная"],e:"На осевую, параксиальную, промежуточную и латеральную (боковую) мезодерму.",m:"От оси к бокам: осевая → параксиальная → промежуточная → латеральная."},
{n:30,t:1,q:"Какие структуры мезодермы формируют вторичную полость тела?",a:"Соматический и спланхнический листки латеральной мезодермы",w:["Склеротом и миотом сомитов","Промежуточная мезодерма (нефротом)","Хорда и параксиальная мезодерма"],e:"Соматический и спланхнический листки латеральной мезодермы. Между ними образуется целом.",m:"Целом — полость между двумя листками."},
{n:31,t:1,q:"Какие закладки формируются в сомите?",a:"Склеротом, миотом, дерматом",w:["Нефротом, спланхнотом, гонотом","Соматоплевра и спланхноплевра","Хорда, нервная трубка, первичная кишка"],e:"Склеротом — скелетные структуры. Миотом — скелетная мускулатура. Дерматом — дерма кожи.",m:"Сомит: скелет, мышцы, кожа."},
{n:32,t:1,q:"В какой части мезодермы возникают закладки мочеполовой системы?",a:"В промежуточной мезодерме",w:["В параксиальной мезодерме (сомитах)","В осевой мезодерме (хорде)","В соматическом листке латеральной мезодермы"],e:"В промежуточной мезодерме.",m:"Промежуточная мезодерма — почки и половые органы."},
{n:33,t:1,q:"Из какой части мезодермы формируется сердце?",a:"Из спланхнической (висцеральной) мезодермы кардиогенной области",w:["Из параксиальной мезодермы","Из промежуточной мезодермы","Из соматического листка латеральной мезодермы"],e:"Из спланхнической (висцеральной) мезодермы кардиогенной области.",m:"Сердце — висцеральная мезодерма."},
{n:34,t:1,q:"Из клеток какой части мезодермы возникают кровеносные сосуды?",a:"Из ангиобластов, связанных преимущественно со спланхнической мезодермой",w:["Из склеротома сомитов","Из клеток нервного гребня","Из промежуточной мезодермы"],e:"Из клеток мезодермального происхождения — ангиобластов, преимущественно связанных со спланхнической мезодермой.",m:"Сосуды — ангиобласты."},
{n:35,t:1,q:"Какая часть мезодермы формирует конечности у Хордовых?",a:"Соматический листок латеральной мезодермы (вместе с эктодермой)",w:["Спланхнический листок латеральной мезодермы","Промежуточная мезодерма","Осевая мезодерма"],e:"Соматический листок латеральной мезодермы. В формировании конечностей также участвует эктодерма.",m:"Конечности — соматическая мезодерма + эктодерма."},
{n:36,t:1,q:"Из какой клеточной структуры формируются ганглии вегетативной нервной системы?",a:"Из клеток нервного гребня",w:["Из стенки нервной трубки","Из хорды","Из дерматома сомитов"],e:"Из клеток нервного гребня.",m:"Нервный гребень формирует многие структуры периферической нервной системы."},
{n:37,t:1,q:"Из какой закладки возникает гладкая мускулатура внутренних полых органов?",a:"Из мезенхимы спланхнической мезодермы",w:["Из миотома сомитов","Из клеток нервного гребня","Из энтодермы"],e:"Из мезенхимы спланхнической мезодермы.",m:"Гладкие мышцы внутренних органов — спланхническая мезодерма."},
{n:38,t:1,q:"Из какого зародышевого листка возникает внутренняя выстилка органов дыхательной системы?",a:"Из энтодермы",w:["Из эктодермы","Из мезодермы","Из нервного гребня"],e:"Из энтодермы.",m:"Энтодерма образует внутреннюю выстилку дыхательной и пищеварительной систем."},
{n:39,t:1,q:"Какие ткани формируются из эктодермы?",a:"Нервная ткань, эпидермис и его производные, органы чувств, эмаль зубов",w:["Эпителий кишки, печень, поджелудочная железа","Мышцы, кости, кровь, сосуды","Почки, половые железы, сердце"],e:"Нервная ткань, эпидермис кожи и его производные, органы чувств, эмаль зубов.",m:"Эктодерма — наружный покров и нервная система."},
{n:40,t:1,q:"Какие ткани формируются из энтодермы?",a:"Эпителий пищеварительной трубки и дыхательных путей, печень, поджелудочная",w:["Нервная ткань, эпидермис, эмаль зубов","Мышечная, костная ткани и кровь","Дерма, сердце, почки"],e:"Эпителий пищеварительной трубки и дыхательных путей, печень, поджелудочная железа и некоторые железы.",m:"Энтодерма — внутренняя выстилка трубок и железы."},
{n:41,t:1,q:"Какие ткани формируются из мезодермы?",a:"Соединительная, мышечная, костная ткани, кровь, сосуды, сердце, почки",w:["Эпидермис, нервная ткань, эмаль зубов","Эпителий кишки, печень, поджелудочная железа","Сетчатка, хрусталик и нейроны ганглиев"],e:"Соединительная, мышечная и костная ткани, кровь, сосуды, дерма, сердце, почки и половые железы.",m:"Мезодерма — опора, движение, транспорт и выделение."},
// ───── 3. Детерминация и индукция
{n:42,t:2,q:"Как называется процесс определения судьбы клеток зародыша на ранних стадиях развития?",a:"Детерминация",w:["Дифференцировка","Эмбриональная индукция","Компетенция"],e:"Детерминация.",m:"Детерминация — определение будущей судьбы клетки."},
{n:43,t:2,q:"Какие методы использует экспериментальная эмбриология для изучения детерминации?",a:"Пересадка, изоляция, удаление участков, разделение бластомеров, маркировка клеток",w:["Только световая микроскопия фиксированных срезов","Только межвидовая гибридизация","Только подсчёт хромосом в бластомерах"],e:"Пересадка частей зародыша, изоляция и культивирование тканей, удаление отдельных участков, разделение и объединение бластомеров, маркировка клеток и прослеживание их судьбы.",m:"Основные методы: пересадить, изолировать, удалить, пометить."},
{n:44,t:2,q:"Как называется влияние одной части зародыша на другую, в результате которого меняется направление её развития?",a:"Эмбриональная индукция",w:["Детерминация","Регуляция","Компетенция"],e:"Эмбриональная индукция.",m:"Одна ткань направляет развитие другой."},
{n:45,t:2,q:"Кто из учёных открыл явление эмбриональной индукции?",a:"Ганс Шпеман и Хильда Мангольд",w:["Джон Гёрдон","Вильгельм Ру и Ганс Дриш","Томас Морган"],e:"Ганс Шпеман и Хильда Мангольд.",m:"Шпеман и Мангольд — открытие организатора."},
{n:46,t:2,q:"Какая часть зародыша считается первичным индуктором?",a:"Дорсальная губа бластопора (организатор Шпемана)",w:["Анимальная шапочка","Нервная трубка","Вентральная губа бластопора"],e:"Дорсальная губа бластопора — организатор Шпемана.",m:"Дорсальная губа бластопора — первичный организатор."},
{n:47,t:2,q:"Кто впервые клонировал земноводных из ядер клеток взрослых (дифференцированных) клеток?",a:"Джон Гёрдон",w:["Ганс Шпеман","Вильгельм Ру","Ганс Дриш"],e:"Джон Гёрдон — провёл эксперименты по переносу ядер дифференцированных клеток кишечника головастика в яйцеклетки с удалённым ядром.",m:"Гёрдон — ядерный перенос у амфибий."},
{n:48,t:2,q:"Какие механизмы клеточной детерминации считаются самыми важными?",a:"Цитоплазматические детерминанты, межклеточные взаимодействия, индукция, избирательная активность генов",w:["Утрата части генов при каждом делении бластомеров","Только положение клетки относительно силы тяжести","Только количество желтка в бластомере"],e:"Неравномерное распределение цитоплазматических детерминант, межклеточные взаимодействия, эмбриональная индукция и избирательная активность генов.",m:"Судьба клетки зависит от содержимого, сигналов и работы генов."},
{n:49,t:2,q:"На каком уровне детерминации возможно взаимное влияние клеточных пластов друг на друга?",a:"На тканевом",w:["На молекулярном","На клеточном","На организменном"],e:"На тканевом уровне.",m:"Взаимодействуют целые клеточные пласты — тканевой уровень."},
{n:50,t:2,q:"Какой механизм деления лежит в основе увеличения числа клеток зародыша?",a:"Митоз",w:["Мейоз","Амитоз","Эндомитоз"],e:"Митоз.",m:"Митоз увеличивает число клеток."},
{n:51,t:2,q:"Какое вещество подавляет деление клеток у зародыша и взрослого организма?",a:"Кейлоны",w:["Факторы роста (EGF, FGF)","Митогены","β-катенин"],e:"В классической эмбриологии в качестве ингибиторов деления рассматривают кейлоны — тканеспецифические вещества, тормозящие пролиферацию. Также деление ограничивается контактным ингибированием.",m:"Кейлоны — тормозят деление."},
{n:52,t:2,q:"Какое вещество стимулирует деление клеток у зародыша и взрослого организма?",a:"Митогены и факторы роста (EGF, FGF, PDGF)",w:["Кейлоны","Каспазы","Антагонисты BMP (Chordin)"],e:"Митогены и факторы роста, например EGF, FGF и PDGF.",m:"Факторы роста — стимулируют деление."},
{n:53,t:2,q:"От каких факторов зависит объединение в пласты мигрирующих или диссоциированных клеток?",a:"От адгезии, молекул клеточной поверхности и межклеточного матрикса",w:["Только от размера клеток","Только от числа хромосом","Только от скорости митоза"],e:"От способности клеток к адгезии, наличия молекул клеточной поверхности, состава межклеточного матрикса и особенностей клеточного взаимодействия.",m:"Клетки объединяются благодаря специфическому сцеплению."},
{n:54,t:2,q:"Клетки каких структур зародыша наиболее активно мигрируют перед детерминацией?",a:"Мезенхима, нервный гребень, гаструлирующие клетки",w:["Эпидермис","Клетки сформированной хорды","Эпителий кишки"],e:"Особенно активно мигрируют клетки мезенхимы, нервного гребня и гаструлирующие клетки зародыша.",m:"Мезенхима и нервный гребень — активные мигранты."},
{n:55,t:2,q:"Какие механизмы лежат в основе сохранения целостности онтогенеза?",a:"Межклеточные взаимодействия, регуляция деления и дифференцировки, миграция, адгезия, апоптоз, экспрессия генов",w:["Только непрерывное деление всех клеток","Только запас питательных веществ в желтке","Неизменность судьбы всех клеток начиная с зиготы"],e:"Межклеточные взаимодействия, регуляция деления и дифференцировки, миграция, адгезия клеток, апоптоз и регуляция экспрессии генов.",m:"Целостность развития обеспечивают согласованные действия клеток."},
// ───── 4. Гибель клеток и регенерация
{n:56,t:3,q:"Как называется гибель клеток при патологии или повреждении?",a:"Некроз",w:["Апоптоз","Аутофагия","Кавитация"],e:"Некроз.",m:"Повреждение — некроз."},
{n:57,t:3,q:"Как называется гибель клеток в нормальных физиологических условиях?",a:"Апоптоз",w:["Некроз","Кавитация","Морфаллаксис"],e:"Апоптоз.",m:"Запрограммированная гибель — апоптоз."},
{n:58,t:3,q:"За счёт какого механизма формируется полость кровеносного сосуда?",a:"Кавитация",w:["Инвагинация","Деламинация","Эпиболия"],e:"За счёт кавитации — образования просвета внутри клеточного тяжа или объединения межклеточных пространств.",m:"Кавитация — образование полости."},
{n:59,t:3,q:"Как называется процесс восстановления утраченных или повреждённых частей органов и тканей?",a:"Регенерация",w:["Гистогенез","Метаморфоз","Органогенез"],e:"Регенерация.",m:"Регенерация — восстановление."},
{n:60,t:3,q:"Как называется процесс клеточного самообновления организма?",a:"Клеточное обновление (за счёт стволовых и камбиальных клеток)",w:["Репаративная регенерация","Морфаллаксис","Эпиморфоз"],e:"Клеточное обновление за счёт деления стволовых и камбиальных клеток, а также некоторых дифференцированных клеток.",m:"Самообновление — образование новых клеток взамен старых."},
{n:61,t:3,q:"Как называется восстановление органов и тканей в ответ на повреждение?",a:"Репаративная регенерация",w:["Физиологическая регенерация","Клеточное обновление","Гистогенез"],e:"Репаративная регенерация.",m:"Повреждение — репаративная регенерация."},
{n:62,t:3,q:"Какой процесс лежит в основе физиологической регенерации?",a:"Постоянное обновление клеток за счёт деления и дифференцировки",w:["Образование бластемы после ампутации","Перестройка оставшихся тканей в целый организм","Замещение утраченного рубцовой тканью"],e:"Постоянное обновление клеток за счёт их деления и дифференцировки.",m:"Физиологическая регенерация — регулярная замена клеток."},
{n:63,t:3,q:"Какой вид физиологической регенерации лежит в основе роста волос и ногтей?",a:"Клеточная регенерация — деление клеток матрикса",w:["Внутриклеточная регенерация без деления клеток","Эпиморфоз","Морфаллаксис"],e:"Клеточная регенерация — обновление клеток за счёт деления клеток матрикса волоса и ногтя.",m:"Волосы и ногти растут благодаря делению клеток матрикса."},
{n:64,t:3,q:"Как называется регенерация, наблюдаемая при восстановлении утраченных конечностей?",a:"Эпиморфоз (эпиморфная регенерация)",w:["Морфаллаксис","Физиологическая регенерация","Регенерационная гипертрофия"],e:"Эпиморфоз (эпиморфная регенерация).",m:"Эпиморфоз — восстановление через образование бластемы."},
{n:65,t:3,q:"Как называется восстановление целого организма из небольшой части тела?",a:"Морфаллаксис",w:["Эпиморфоз","Гистогенез","Клеточное обновление"],e:"Морфаллаксис — восстановление целого организма из части тела за счёт перестройки сохранившихся тканей.",m:"Морфаллаксис — из части восстанавливается целое."},
{n:66,t:3,d:1,q:"Как называется регенерация, при которой восстанавливаются размеры, но не форма и структура утраченной части органа?",a:"Регенерационная (компенсаторная) гипертрофия — неполная регенерация",w:["Эпиморфоз","Морфаллаксис","Физиологическая регенерация"],e:"Формулировка неоднозначная. Обычно такое восстановление описывают как неполную регенерацию или компенсаторную перестройку; во многих учебниках это называется регенерационной гипертрофией (например, печень восстанавливает массу, но не форму). Термин стоит сверить с классификацией из лекции.",m:"Не путай с эпиморфозом: при нём формируется новая бластема."},
{n:67,t:3,q:"Основателем экспериментального направления в эмбриологии является:",a:"Вильгельм Ру",w:["Ганс Дриш","Карл Бэр","Томас Морган"],e:"Вильгельм Ру.",m:"Ру — основатель экспериментальной эмбриологии."},
// ───── 5. Потенции клеток и учёные
{n:68,t:4,q:"Верно ли: «Детерминация — это процесс определения судьбы данной части зародыша»?",a:TF[0],w:[TF[1]],e:"Верно. Детерминация — процесс ограничения потенций и определения дальнейшей судьбы клеток или частей зародыша.",m:"Детерминация определяет направление развития."},
{n:69,t:4,q:"Верно ли: «Термин детерминация относят преимущественно к ранним эмбриональным закладкам, а о коммитации говорят чаще применительно к отдельным клеткам, судьба которых определяется на сравнительно поздних стадиях»?",a:TF[0],w:[TF[1]],e:"Верно. Детерминация чаще относится к ранним зачаткам, а коммитация — к отдельным клеткам на более поздних этапах.",m:"Коммитация — более позднее ограничение судьбы клетки."},
{n:70,t:4,q:"Верно ли: «Потенция части зародыша — это то, что она может дать при любых условиях, отличных от нормальных»?",a:TF[1],w:[TF[0]],e:"Неверно. Потенция — это совокупность возможных направлений развития клетки или части зародыша при определённых условиях.",m:"Потенция — что клетка может образовать."},
{n:71,t:4,q:"Какие клетки зародыша обладают тотипотентностью?",a:"Зигота и ранние бластомеры",w:["Гемопоэтические стволовые клетки","Клетки нервного гребня","Клетки эпителия кишки"],e:"Зигота и ранние бластомеры, способные дать начало целому организму и внезародышевым структурам.",m:"Тоти — всё."},
{n:72,t:4,q:"Какие клетки обладают мультипотентностью?",a:"Стволовые клетки, дающие несколько родственных типов (напр., гемопоэтические)",w:["Зигота","Ранние бластомеры на стадии 2–4 клеток","Зрелые эритроциты"],e:"Стволовые клетки, способные образовывать несколько родственных типов клеток, например гемопоэтические стволовые клетки крови.",m:"Мульти — несколько родственных типов."},
{n:73,t:4,d:1,q:"Какие клетки зародыша обладают полипотентностью?",a:"Клетки, способные дать много типов клеток, но не все ткани",w:["Только зигота — может дать весь организм","Клетки, способные дать только один тип клеток","Полностью дифференцированные клетки"],e:"Клетки, способные дифференцироваться во множество типов клеток, но не во все ткани организма. В разных учебных курсах термин может употребляться неодинаково.",m:"Поли — много, но не всё."},
{n:74,t:4,q:"На какой стадии развития появляются клетки с унипотентностью?",a:"На поздних стадиях дифференцировки",w:["На стадии зиготы","На стадии 2–4 бластомеров","На стадии морулы"],e:"На более поздних стадиях дифференцировки, когда клетки уже ограничены одной линией развития.",m:"Уни — один тип клеток."},
{n:75,t:4,q:"С каким объектом экспериментировал Т. Морган?",a:"С дрозофилой (Drosophila melanogaster)",w:["С морским ежом","С тритоном","С лягушкой"],e:"С плодовой мушкой дрозофилой — Drosophila melanogaster.",m:"Морган — дрозофила."},
{n:76,t:4,q:"Как представлял Т. Морган процесс детерминации?",a:"Связывал наследственные признаки с генами, расположенными в хромосомах",w:["Считал, что ядро теряет детерминанты при каждом делении","Отрицал роль ядра в развитии","Связывал детерминацию только с количеством желтка"],e:"Морган связывал наследственные признаки с генами, расположенными в хромосомах. Современное представление о детерминации также учитывает избирательную активность генов и межклеточные сигналы.",m:"Морган — хромосомная теория наследственности."},
{n:77,t:4,q:"Утверждение: «При делении клеток зародыша наблюдается неравнонаследственное деление ядра: ядро состоит из детерминант, и все детерминанты сохраняют только половые клетки». Как его оценить?",a:"Это историческая гипотеза; при митозе геном одинаков, различается активность генов",w:["Верно: соматические клетки теряют часть генов","Верно: полный набор генов есть только в половых клетках","Неверно: при митозе ядро вообще не делится"],e:"Это историческая гипотеза о детерминантах (её обычно связывают с А. Вейсманом), а не современное представление о митозе. При обычном митозе дочерние клетки получают одинаковый набор хромосом, а различия их судеб связаны с регуляцией активности генов.",m:"При митозе геном одинаковый, но работают разные гены."},
{n:78,t:4,q:"С каким объектом проводил эксперименты Г. Дриш?",a:"С морскими ежами",w:["С тритонами","С лягушками","С дрозофилой"],e:"С морскими ежами.",m:"Дриш — морской ёж."},
{n:79,t:4,q:"С каким объектом экспериментировал Г. Шпеман?",a:"С амфибиями (тритонами)",w:["С морскими ежами","С дрозофилой","С куриным эмбрионом"],e:"С амфибиями, в частности тритонами.",m:"Шпеман — тритон."},
{n:80,t:4,q:"Какой учёный установил, что при разделении зародыша на стадии 4–8 бластомеров появляются однояйцевые близнецы?",a:"Ганс Шпеман",w:["Вильгельм Ру","Джон Гёрдон","Томас Морган"],e:"В учебных курсах это обычно связывают с опытами Ганса Шпемана по разделению раннего зародыша амфибий.",m:"Шпеман — разделение раннего зародыша."},
{n:81,t:4,q:"Какие ограничения имеет закон Дришевских регуляций?",a:"Не универсален: зависит от вида и стадии; при мозаичном развитии не работает",w:["Действует только у млекопитающих","Ограничений нет — закон универсален","Применим только к взрослым организмам"],e:"Он не универсален: регулятивное развитие характерно не для всех животных и не для всех стадий. При мозаичном развитии разделённые бластомеры могут не образовать полноценный организм.",m:"Регуляция зависит от вида и стадии развития."},
{n:82,t:4,q:"Какой учёный экспериментально доказал, что мезодерму индуцирует энтодерма дна бластулы?",a:"Пауль Ньюкуп",w:["Ганс Шпеман","Иоганнес Холтфретер","Джон Гёрдон"],e:"Пауль Ньюкуп.",m:"Ньюкуп — вегетативная энтодерма индуцирует мезодерму."},
{n:83,t:4,d:1,q:"Какой учёный экспериментально доказал существование механизмов сортировки клеток у зародыша?",a:"Холтфретер",w:["Ньюкуп","Морган","Гёрдон"],e:"Г. Холтфретер и Г. Дриш проводили классические исследования клеточной сортировки и взаимного сродства клеток. В зависимости от формулировки курса может ожидаться Холтфретер.",m:"Холтфретер — сортировка клеток."},
// ───── 6. Эмбриональная индукция
{n:84,t:5,q:"В опытах Шпемана и Мангольд какая структура является индуктором?",a:"Дорсальная губа бластопора",w:["Анимальная эктодерма","Энтодерма дна бластулы","Нервная трубка"],e:"Дорсальная губа бластопора — организатор Шпемана.",m:"Индуктор — дорсальная губа."},
{n:85,t:5,q:"В опытах Шпемана и Мангольд какая структура является компетентной тканью?",a:"Дорсальная эктодерма, способная стать нервной тканью",w:["Дорсальная губа бластопора","Энтодерма дна бластулы","Хорда"],e:"Дорсальная эктодерма зародыша, способная под действием организатора развиваться в нервную ткань.",m:"Компетентная ткань — эктодерма, которая отвечает на сигнал."},
{n:86,t:5,q:"В опытах П. Ньюкупа какая структура является индуктором?",a:"Клетки вегетативного полюса (Ньюкуповский центр)",w:["Анимальная шапочка","Дорсальная губа бластопора","Маргинальная эктодерма"],e:"Клетки вегетативного полюса зародыша — Ньюкуповский центр.",m:"Индуктор — вегетативный полюс."},
{n:87,t:5,q:"В опытах П. Ньюкупа какая структура является компетентной тканью?",a:"Анимальная эктодерма (анимальная шапочка)",w:["Клетки вегетативного полюса","Дорсальная губа бластопора","Хорда"],e:"Анимальная эктодерма (анимальная шапочка), способная отвечать на индуцирующие сигналы.",m:"Компетентная ткань — анимальная шапочка."},
{n:88,t:5,q:"Верно ли: «Под эмбриональной индукцией понимают взаимодействие эмбриональных закладок, ведущее к формообразовательному эффекту»?",a:TF[0],w:[TF[1]],e:"Верно. Одна часть зародыша влияет на развитие другой, изменяя её направление дифференцировки.",m:"Индукция — влияние одной ткани на другую."},
{n:89,t:5,q:"Какие виды первичной индукции выделяют по современным представлениям?",a:"Нейральная, мезодермальная и осевая (дорсальная)",w:["Эпиморфная, морфаллактическая, клеточная","Спиральная, радиальная, билатеральная","Тотипотентная, мультипотентная, унипотентная"],e:"Выделяют нейральную индукцию, мезодермальную индукцию и индукцию осевых структур (дорсальную/осевую индукцию).",m:"Нервная система, мезодерма и ось зародыша."},
{n:90,t:5,q:"Какими свойствами обладает индуктор?",a:"Вызывает специфический ответ; эффект зависит от дозы, времени и места",w:["Действует одинаково на любую ткань в любое время","Работает только при слиянии клеток","Действует независимо от концентрации"],e:"Способностью вызывать специфический ответ компетентной ткани; действие зависит от концентрации, времени и места воздействия.",m:"Индуктор должен быть специфичным и действовать в нужной дозе."},
{n:91,t:5,q:"Какими свойствами обладает компетентная ткань?",a:"Воспринимает сигнал и отвечает изменением активности генов и дифференцировки",w:["Сама выделяет индуцирующие белки","Компетентна на любой стадии развития","Отвечает одинаково на любой сигнал"],e:"Она способна воспринимать индуцирующий сигнал и отвечать на него изменением активности генов и направления дифференцировки.",m:"Компетентность — способность услышать и выполнить сигнал."},

<script>

} catch(e) {}

// ── helpers

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = a => a[Math.random() * a.length | 0];
function seeded(seed){ return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

  ["🥇","Золото!","Экзаменатор был бы в восторге."], ["🌈","Восхитительно!","Каждый такой ответ — шаг к пятёрке."], ["😎","Легко и уверенно!","Вот это класс."],
  ["💪","Мощно!","Знания на месте."], ["🎯","В яблочко!","Попадание 100%."], ["🦉","Мудро!","Ты отлично в этом разбираешься."]

  ["🤗","Не беда!","Вопрос вернётся в «Работе над ошибками» — и там ты его победишь."], ["🧩","Хитрый вопрос!","Разберём — и в следующий раз будет легко."],
  ["☀️","Всё получится!","Каждая ошибка делает тебя сильнее перед экзаменом."], ["🎈","Спокойно, это тренировка!","Именно для этого она и нужна."],
  ["🔁","Запомним вместе!","Глянь на правильный ответ — он уже твой."], ["🌟","Ты молодец, что пробуешь!","Следующий вопрос будет твоим."],
  ["🍀","В следующий раз повезёт!","А пока — короткий разбор ниже."], ["🚲","Упал — поднялся!","Едем дальше, знание уже ближе."]
];
function burst(){

// Fixed tickets
useBank(S.bank);

// ── theme
function applyTheme(){

}

document.getElementById("homeBtn").onclick = () => { if (!sess || sess.finished || !Object.keys(sess.ans).length || confirm("Выйти на главную? Ответы уже учтены в статистике.")) home(); };

// ── timer
let tick = null;
const $timer = document.getElementById("timer"), $tv = document.getElementById("timerVal");
function stopTimer(){ clearInterval(tick); tick = null; $timer.classList.add("hidden"); $timer.classList.remove("warn"); }
function startTimer(sec, onEnd){
  stopTimer(); const end = Date.now() + sec * 1000; $timer.classList.remove("hidden");
  const upd = () => { const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    $tv.textContent = String(left / 60 | 0).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    $timer.classList.toggle("warn", left <= 60);
    if (left <= 0) { stopTimer(); onEnd(); } };
  upd(); tick = setInterval(upd, 500);
}

// ── session
let sess = null, fc = null;
function start(opts){
  fc = null;
  const items = opts.items.slice();
  sess = Object.assign({ idx:0, ans:{}, sel:{}, finished:false, started:Date.now(), streak:0 }, opts, { items,
    opts: Object.fromEntries(items.map(n => { const q = BY[n];
      const right = Array.isArray(q.a) ? q.a : [q.a];
      const list = [...right.map(t => ({ t, ok:true })), ...q.w.map(t => ({ t, ok:false }))];
      return [n, list.length === 2 ? list.sort((x, y) => (x.t === "Верно" ? 0 : 1) - (y.t === "Верно" ? 0 : 1)) : shuffle(list)]; })) });
  if (opts.timed) startTimer(B.ctrl.min * 60, () => finish(true)); else stopTimer();
  renderQuiz(); window.scrollTo({ top:0 });
}
const curQ = () => BY[sess.items[sess.idx]];
const timedMode = () => sess.kind === "control";

function choose(i){
  const n = sess.items[sess.idx], q = BY[n];
  if (sess.ans[n] != null && !timedMode()) return;
  if (q.multi) {
    const s = new Set(sess.sel[n] || (sess.ans[n] ? sess.ans[n].sel : []));
    s.has(i) ? s.delete(i) : s.add(i); sess.sel[n] = [...s];
    return renderQuiz();
  }
  submit([i]);
}
function submit(sel){
  const n = sess.items[sess.idx], q = BY[n], opts = sess.opts[n];
  sel = sel || sess.sel[n] || [];
  if (!sel.length) return;
  const ok = opts.every((o, i) => o.ok === sel.includes(i));
  const first = sess.ans[n] == null;
  sess.ans[n] = { sel:[...sel].sort(), ok };
  delete sess.sel[n];
  if (timedMode()) {
    if (first) record(n, ok); else fixRecord(n, ok);
    const next = nextUnanswered();
    if (next < 0) return finish(false);
    sess.idx = next;
    return renderQuiz();
  }
  record(n, ok);
  sess.streak = ok ? sess.streak + 1 : 0;
  const base = ok ? rand(PRAISE) : rand(CHEER);
  sess.ans[n].msg = [base[0], base[1], ok && STREAK[sess.streak] ? STREAK[sess.streak] : base[2]];
  renderQuiz();
  if (ok) burst();
}
function record(n, ok){
  const p = Object.assign({ c:0, w:0, s:0 }, P.p[n]);
  p.prev = { c:p.c, w:p.w, s:p.s };
  if (ok) { p.c++; p.s++; } else { p.w++; p.s = 0; }
  p.t = Date.now(); P.p[n] = p; save();
}
function fixRecord(n, ok){ // control mode: answer changed before finishing — redo the last record
  const p = P.p[n]; if (p && p.prev) { Object.assign(p, p.prev); P.p[n] = p; } record(n, ok);
}
function nextUnanswered(){
  const L = sess.items.length;
  for (let k = 1; k <= L; k++) { const j = (sess.idx + k) % L; if (sess.ans[sess.items[j]] == null) return j; }
  return -1;
}
function go(delta){
  const j = sess.idx + delta;
  if (j < 0) return;
  if (j >= sess.items.length) {
    if (Object.keys(sess.ans).length === sess.items.length) return finish(false);
    sess.idx = nextUnanswered(); return renderQuiz();
  }
  sess.idx = j; renderQuiz();
}
function finish(timeout){
  stopTimer(); sess.finished = true; sess.timeout = timeout;
  const total = sess.items.length, right = sess.items.filter(n => sess.ans[n] && sess.ans[n].ok).length;
  const errs = total - right;
  sess.pass = sess.kind === "control" ? (!timeout && errs <= B.ctrl.err) : sess.kind === "ticket" ? errs <= 2 : right / total >= .8;
  if (sess.kind === "ticket") { const prev = P.tickets[sess.ticket]; if (!prev || right >= prev.r) P.tickets[sess.ticket] = { r:right, t:total }; }
  if (sess.kind === "control") { P.exams.unshift({ r:right, t:total, d:Date.now(), pass:sess.pass }); P.exams = P.exams.slice(0, 20); }
  save(); renderResult();
}

// ── render: home
function ringSvg(pct){
  const r = 50, c = 2 * Math.PI * r;

}

  $app.innerHTML = `

    `<button role="tab" data-bank="${b.id}" class="${b.id === B.id ? "on" : ""}" aria-selected="${b.id === B.id}"><b>${b.label}</b><span>${b.subject} · ${b.Q.length} вопр.</span></button>`).join("")}</div>
  <section class="hero">
    <div><div class="eyebrow">${B.label} · ${esc(B.subject)}</div>
      <h1>Решай билеты.<br><em>Закрывай пробелы.</em></h1>
      <p>${total} вопросов, ${TOPICS.length} тем, ${B.tickets} билетов${multiN ? `, из них ${multiN} — с несколькими верными ответами` : ""}. Вопрос считается выученным после ${MASTER} верных ответов подряд — ошибка возвращает его в работу.</p></div>

  </section>

    ${mode("errors", "↻", "Работа над ошибками", "Только вопросы, где была ошибка и ещё нет двух верных ответов подряд.", plural(errs, "вопрос", "вопроса", "вопросов"), false, !errs)}

  </div>

  <div class="tickets">${TICKETS.map((t, i) => { const r = P.tickets[i]; const cl = r ? (r.t - r.r <= 2 ? "pass" : "fail") : "";
    return `<button class="ticket ${cl}" data-ticket="${i}"><b>${i + 1}</b><span>${t.length} вопросов</span>${r ? `<span class="res">${r.r}/${r.t}</span>` : ""}</button>`; }).join("")}</div>

  <h2 class="sec">По темам</h2>
  <div class="topics">${TOPICS.map((name, i) => { const qs = Q.filter(q => q.t === i), m = qs.filter(q => isMastered(q.n)).length;
    return `<button class="topic" data-topic="${i}"><span class="num">${i + 1}</span><span class="tt"><div>${esc(name)}</div><div class="track"><i style="width:${m / qs.length * 100}%"></i></div></span><span class="pc">${m}/${qs.length}</span></button>`; }).join("")}</div>

  </footer>`;

  $app.querySelectorAll("[data-bank]").forEach(b => b.onclick = () => { useBank(b.dataset.bank); save(); home(); });
  $app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => launch(b.dataset.mode));

  $app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { const i = +b.dataset.topic;
    start({ kind:"topic", title:TOPICS[i], sub:`${B.label} · тема ${i + 1}`, items:Q.filter(q => q.t === i).map(q => q.n) }); });

}
const stat = (v, l, w, col) => `<div class="stat"><b>${v}</b><span>${l}</span><div class="track"><i style="width:${w}%;${col ? "background:" + col : ""}"></i></div></div>`;
const mode = (id, ico, t, d, n, primary, dis) => `<button class="mode${primary ? " primary" : ""}" data-mode="${id}"${dis ? " disabled" : ""}><span class="ico">${ico}</span><b>${t}</b><span>${d}</span><span class="n">${n}</span></button>`;

function launch(m){
  if (m === "control") return start({ kind:"control", title:"Контрольная", sub:`${B.label} · ${B.ctrl.size} вопросов · ${B.ctrl.min} мин`, items:controlPick(), timed:true });
  if (m === "errors") return start({ kind:"errors", title:"Работа над ошибками", sub:B.label, items:shuffle(errorPool()) });
  if (m === "marathon") return start({ kind:"marathon", title:"Марафон", sub:B.label, items:shuffle(Q.map(q => q.n)) });
  if (m === "smart") return start({ kind:"smart", title:"Умная тренировка", sub:B.label, items:smartPick(15) });
  if (m === "cards") return cards();
  if (m === "bank") return bank();
}
function controlPick(){
  const size = B.ctrl.size, out = [];
  TOPICS.forEach((_, i) => { const qs = shuffle(Q.filter(q => q.t === i).map(q => q.n)); out.push(...qs.slice(0, Math.max(1, Math.round(qs.length / Q.length * size)))); });
  const rest = shuffle(Q.map(q => q.n).filter(n => !out.includes(n)));
  while (out.length < size) out.push(rest.pop());
  return shuffle(shuffle(out).slice(0, size));
}
function smartPick(k){
  const errs = shuffle(errorPool()), unseen = shuffle(Q.filter(q => !P.p[q.n]).map(q => q.n));
  const learning = shuffle(Q.filter(q => P.p[q.n] && !isMastered(q.n) && !errs.includes(q.n)).map(q => q.n));
  const old = Q.filter(q => isMastered(q.n)).map(q => q.n).sort((a, b) => (P.p[a].t || 0) - (P.p[b].t || 0));
  const out = [];
  for (const pool of [errs.slice(0, 7), learning, unseen, old, shuffle(Q.map(q => q.n))]) for (const n of pool) { if (out.length >= k) break; if (!out.includes(n)) out.push(n); }
  return shuffle(out);
}

// ── render: quiz
function renderQuiz(){
  const n = sess.items[sess.idx], q = BY[n], a = sess.ans[n], opts = sess.opts[n];
  const ctl = timedMode(), answered = Object.keys(sess.ans).length, L = sess.items.length;
  const reveal = a != null && !ctl;
  const pending = q.multi ? (sess.sel[n] || (ctl && a ? a.sel : [])) : [];
  const fav = P.fav.includes(n);
  const needCheck = q.multi && !reveal;
  $app.innerHTML = `
  <div class="qhead"><div><div class="eyebrow">${esc(sess.sub)}</div><h3>${esc(sess.title)}</h3></div>
    <div style="display:flex;gap:8px"><button class="btn" id="quitBtn">Выйти</button>${ctl ? `<button class="btn" id="finBtn">Завершить</button>` : ""}</div></div>
  ${L <= 40 ? `<div class="strip">${sess.items.map((m, i) => { const x = sess.ans[m];
      const cl = [i === sess.idx ? "cur" : "", x ? (ctl ? "done" : x.ok ? "ok" : "bad") : ""].join(" ");
      return `<button class="pill ${cl}" data-go="${i}">${i + 1}</button>`; }).join("")}</div>`
    : `<div class="progress"><i style="width:${answered / L * 100}%"></i></div>`}
  <section class="card">
    <div class="qmeta"><span class="tag">Вопрос ${sess.idx + 1} из ${L}</span><span class="tag">№ ${n} · ${esc(TOPICS[q.t])}</span>
      ${q.multi ? `<span class="tag multi">☑ несколько верных ответов</span>` : ""}
      ${q.d ? `<span class="tag warn" title="Формулировка неоднозначна">⚠ сверить с лекцией</span>` : ""}
      <button class="star${fav ? " on" : ""}" id="favBtn" title="Отметить вопрос">${fav ? "★ в избранном" : "☆ отметить"}</button></div>
    <p class="question">${esc(q.q)}</p>
    <div class="options${q.multi ? " multi" : ""}">${opts.map((o, i) => { let cl = "";
        if (reveal) { const ch = a.sel.includes(i); cl = o.ok ? (ch ? "ok" : "miss") : ch ? "bad" : "dim"; }
        else if (q.multi ? pending.includes(i) : a && a.sel.includes(i)) cl = "sel";
        return `<button class="option ${cl}" data-opt="${i}" ${reveal ? "disabled" : ""}><span class="optkey">${q.multi && !reveal && pending.includes(i) ? "✓" : i + 1}</span><span>${esc(o.t)}</span></button>`; }).join("")}</div>
    ${reveal ? explain(q, a) : ""}
    <div class="actions">
      <button class="btn" id="prevBtn" ${sess.idx === 0 ? "disabled" : ""}>← Назад</button>
      <span class="hint">${q.multi && !reveal ? "Отметь все верные: " : ""}<span class="kbd">1</span>–<span class="kbd">${opts.length}</span> ${q.multi ? "отметить" : "выбрать"} · <span class="kbd">Enter</span> ${needCheck ? "проверить" : "дальше"}</span>
      ${needCheck ? `<button class="btn main" id="checkBtn" ${pending.length ? "" : "disabled"}>${ctl ? "Ответить" : "Проверить"} ✓</button>`
        : `<button class="btn${a ? " main" : ""}" id="nextBtn">${answered === L ? "Результат →" : a ? "Дальше →" : "Пропустить →"}</button>`}
    </div>
    ${needCheck ? `<div style="text-align:right;margin-top:8px"><button class="link" id="skipBtn">${answered === L ? "Результат →" : "Пропустить →"}</button></div>` : ""}
  </section>`;
  $app.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => choose(+b.dataset.opt));
  $app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { sess.idx = +b.dataset.go; renderQuiz(); });
  document.getElementById("prevBtn").onclick = () => go(-1);
  const nb = document.getElementById("nextBtn"); if (nb) nb.onclick = () => answered === L ? finish(false) : go(1);
  const cb = document.getElementById("checkBtn"); if (cb) cb.onclick = () => submit();
  const sb = document.getElementById("skipBtn"); if (sb) sb.onclick = () => answered === L ? finish(false) : go(1);
  document.getElementById("quitBtn").onclick = () => { if (!answered || confirm("Прервать? Ответы уже учтены в статистике.")) home(); };
  document.getElementById("favBtn").onclick = () => { P.fav = fav ? P.fav.filter(x => x !== n) : [...P.fav, n]; save(); renderQuiz(); };
  const fb = document.getElementById("finBtn");
  if (fb) fb.onclick = () => { if (confirm(`Завершить контрольную? Без ответа: ${L - answered}.`)) finish(false); };
}
function explain(q, a){
  const [em, title, sub] = a.msg || (a.ok ? PRAISE[0] : CHEER[0]);
  return `<div class="answerbox${a.ok ? "" : " bad"}"><div class="praise"><span class="em">${em}</span><div><b>${esc(title)}</b><small>${esc(sub)}</small></div></div>
    <p>${esc(q.e)}</p>${q.m ? `<div class="memo"><b>Запомнить:</b><span>${esc(q.m)}</span></div>` : ""}</div>`;
}

// ── render: result
function resultCheer(ratio, pass){
  if (ratio === 1) return "Идеальный результат! Ни одной ошибки — это высший класс 👑";
  if (pass && ratio >= .9) return "Потрясающе! Ты почти безупречно знаешь материал 🌟";
  if (pass) return "Отличная работа! Зачёт в кармане — так держать 💪";
  if (ratio >= .6) return "Уже очень близко! Перерешай ошибки — и всё получится 🌱";
  return "Хорошее начало! Каждый прогон делает тебя увереннее — вперёд к цели 🚀";
}
function renderResult(){
  const total = sess.items.length, right = sess.items.filter(n => sess.ans[n] && sess.ans[n].ok).length;
  const wrong = sess.items.filter(n => !(sess.ans[n] && sess.ans[n].ok));
  const mins = Math.max(1, Math.round((Date.now() - sess.started) / 60000));
  const verdict = sess.kind === "control" ? (sess.pass ? "Контрольная сдана" : sess.timeout ? "Время вышло" : "Пока не сдана")
    : sess.kind === "ticket" ? (sess.pass ? "Билет сдан" : "Билет пока не сдан") : (sess.pass ? "Отлично!" : "Есть над чем поработать");
  $app.innerHTML = `
  <section class="card result ${sess.pass ? "pass" : "fail"}" style="margin-top:22px">
    <div class="eyebrow">${esc(sess.sub)} · ${esc(sess.title)}</div>
    <div class="big">${right}/${total}</div>
    <div class="verdict">${verdict}</div>
    <p>${plural(total - right, "ошибка", "ошибки", "ошибок")} · ${plural(mins, "минута", "минуты", "минут")}${sess.kind === "control" ? ` · допускается не больше ${B.ctrl.err}` : ""}</p>
    <p class="cheer">${resultCheer(right / total, sess.pass)}</p>
    <div class="actions" style="justify-content:center">
      ${wrong.length ? `<button class="btn main" id="redoBtn">Перерешать ошибки (${wrong.length})</button>` : ""}
      <button class="btn" id="againBtn">${sess.kind === "ticket" ? "Пройти билет заново" : sess.kind === "control" ? "Новая контрольная" : "Ещё раз"}</button>
      ${sess.kind === "ticket" && sess.ticket < B.tickets - 1 ? `<button class="btn" id="nextTBtn">Билет ${sess.ticket + 2} →</button>` : ""}
      <button class="btn" id="homeBtn2">На главную</button>
    </div>
  </section>
  ${wrong.length ? `<h2 class="sec">Разбор ошибок</h2><div class="reslist">${wrong.map(n => { const q = BY[n], a = sess.ans[n];
    return `<div class="resitem"><div class="q">№ ${n}. ${esc(q.q)}</div>
      <div class="yours">${a ? "✕ Твой ответ: " + esc(a.sel.map(i => sess.opts[n][i].t).join("; ")) : "— Без ответа"}</div>
      <div class="right">✓ Верно: ${esc(ansText(q))}</div>
      ${q.m ? `<div class="memo"><b>Запомнить:</b><span>${esc(q.m)}</span></div>` : ""}</div>`; }).join("")}</div>` : ""}`;
  const prev = sess;
  const r = document.getElementById("redoBtn");
  if (r) r.onclick = () => start({ kind:"redo", title:"Перерешать ошибки", sub:prev.sub, items:shuffle(wrong) });
  document.getElementById("againBtn").onclick = () => prev.kind === "control" ? launch("control") : prev.kind === "smart" ? launch("smart")
    : start({ kind:prev.kind, ticket:prev.ticket, title:prev.title, sub:prev.sub, items:shuffle(prev.items) });
  const nt = document.getElementById("nextTBtn");
  if (nt) nt.onclick = () => openTicket(prev.ticket + 1);
  document.getElementById("homeBtn2").onclick = home;
  window.scrollTo({ top:0 });
  if (sess.pass) setTimeout(burst, 150);
}

// ── flashcards
function cards(){
  sess = null; stopTimer();
  const errs = errorPool(), rest = Q.filter(q => !isMastered(q.n) && !errs.includes(q.n)).map(q => q.n);
  const items = errs.length + rest.length ? [...shuffle(errs), ...shuffle(rest)] : shuffle(Q.map(q => q.n));
  fc = { items, i:0, flip:false, know:0, dont:0 };
  renderCard();
}
function renderCard(){
  if (fc.i >= fc.items.length) {
    $app.innerHTML = `<section class="card result pass" style="margin-top:22px"><div class="eyebrow">Карточки</div><div class="big">${fc.know}/${fc.know + fc.dont}</div>
      <div class="verdict">Колода пройдена! 🎉</div><p>Отметки «не знал(а)» попали в работу над ошибками.</p>
      <div class="actions" style="justify-content:center"><button class="btn main" id="c1">Новая колода</button><button class="btn" id="c2">На главную</button></div></section>`;
    document.getElementById("c1").onclick = cards; document.getElementById("c2").onclick = home; burst(); return;
  }
  const n = fc.items[fc.i], q = BY[n];
  $app.innerHTML = `
  <div class="qhead"><div><div class="eyebrow">${B.label} · карточки · вспомни ответ без подсказок</div><h3>${fc.i + 1} из ${fc.items.length}</h3></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="tag">знаю ${fc.know}</span><span class="tag">не знаю ${fc.dont}</span><button class="btn" id="quitBtn">Выйти</button></div></div>
  <div class="progress"><i style="width:${fc.i / fc.items.length * 100}%"></i></div>
  <section class="card flash" id="flash">
    <div class="qmeta" style="justify-content:center"><span class="tag">№ ${n} · ${esc(TOPICS[q.t])}</span>${q.multi ? `<span class="tag multi">несколько ответов</span>` : ""}${q.d ? `<span class="tag warn">⚠ сверить с лекцией</span>` : ""}</div>
    <p class="question">${esc(q.q)}</p>
    ${fc.flip ? `<div class="back"><div class="ans">${esc(ansText(q))}</div>${q.m ? `<p style="margin:0 0 8px">${esc(q.e)}</p><div class="memo"><b>Запомнить:</b><span>${esc(q.m)}</span></div>` : ""}</div>`
      : `<p class="hint">Нажми на карточку или <span class="kbd">Пробел</span>, чтобы увидеть ответ</p>`}
  </section>
  <div class="actions" ${fc.flip ? "" : 'style="visibility:hidden"'}>
    <button class="btn danger" id="noBtn">✕ Не знаю <span class="kbd">1</span></button>
    <button class="btn main" id="yesBtn">✓ Знаю <span class="kbd">2</span></button>
  </div>`;
  document.getElementById("flash").onclick = () => { if (!fc.flip) { fc.flip = true; renderCard(); } };
  document.getElementById("quitBtn").onclick = home;
  document.getElementById("noBtn").onclick = () => rate(false);
  document.getElementById("yesBtn").onclick = () => rate(true);
}
function rate(ok){ record(fc.items[fc.i], ok); ok ? fc.know++ : fc.dont++; fc.i++; fc.flip = false; renderCard(); if (ok) burst(); }

// ── bank
function bank(){
  sess = null; fc = null; stopTimer();
  $app.innerHTML = `
  <div class="qhead"><div><div class="eyebrow">${B.label} · ${esc(B.subject)}</div><h3>${B.CHEAT ? "Шпаргалка и банк вопросов" : "Банк вопросов"}</h3></div><button class="btn" id="quitBtn">На главную</button></div>
  ${B.CHEAT ? `<h2 class="sec">Что особенно важно выучить</h2>
  <div class="cheat">${B.CHEAT.map(([k, v]) => `<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join("")}</div>` : ""}
  <h2 class="sec">Все вопросы <small>● красный — ошибка, жёлтый — в процессе, зелёный — выучено</small></h2>
  <input class="search" id="q" type="search" placeholder="Поиск по номеру, вопросу или ответу…" autocomplete="off">
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="flt">
    <button class="link" data-f="all">Все</button><button class="link" data-f="fav">★ Избранное (${P.fav.length})</button><button class="link" data-f="err">Ошибки</button><button class="link" data-f="d">⚠ Спорные</button>
  </div>
  <div id="list"></div>`;
  document.getElementById("quitBtn").onclick = home;
  let f = "all";
  const draw = () => {
    const term = document.getElementById("q").value.trim().toLowerCase(), num = /^\d+$/.test(term);
    const errs = errorPool();
    const hl = s => { const e = esc(s); if (!term || num) return e; const t = esc(term), i = e.toLowerCase().indexOf(t);
      return i < 0 ? e : e.slice(0, i) + "<mark>" + e.slice(i, i + t.length) + "</mark>" + e.slice(i + t.length); };
    const items = Q.filter(q => (f === "all" || (f === "fav" && P.fav.includes(q.n)) || (f === "err" && errs.includes(q.n)) || (f === "d" && q.d))
      && (!term || (num ? String(q.n) === term : (q.q + " " + ansText(q) + " " + q.e).toLowerCase().includes(term))));
    let lastT = -1;
    document.getElementById("list").innerHTML = items.map(q => { const head = q.t !== lastT ? `<h2 class="sec">${q.t + 1}. ${esc(TOPICS[q.t])}</h2>` : ""; lastT = q.t;
      return head + `<details class="bankitem"${term ? " open" : ""}><summary><span class="lvl l${level(q.n)}"></span><span class="no">${q.n}.</span><span>${hl(q.q)}${q.d ? ' <span class="tag warn">⚠</span>' : ""}</span></summary>
        <div class="body"><div class="ans">${hl(ansText(q))}</div>${q.m ? `<div>${hl(q.e)}</div><div class="memo"><b>Запомнить:</b><span>${esc(q.m)}</span></div>` : q.d ? `<div class="hint">${esc(q.e)}</div>` : ""}</div></details>`; }).join("")
      || `<p class="hint">Ничего не найдено.</p>`;
    document.querySelectorAll("#flt [data-f]").forEach(b => b.style.borderColor = b.dataset.f === f ? "var(--accent)" : "");
  };
  document.getElementById("q").oninput = draw;
  document.querySelectorAll("#flt [data-f]").forEach(b => b.onclick = () => { f = b.dataset.f; draw(); });
  draw(); window.scrollTo({ top:0 });
}

// ── export / import (all banks at once)
function exportProgress(){
  const blob = new Blob([JSON.stringify(S, null, 1)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "embryolab-progress-" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importProgress(e){
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => { const d = JSON.parse(t);
      if (d && d.b) { for (const k in BANKS) S.b[k] = Object.assign(blank(), d.b[k]); }
      else if (d && d.p) S.b.test = Object.assign(blank(), d);
      else throw 0;
      useBank(S.bank); save(); home(); })
    .catch(() => alert("Не удалось прочитать файл прогресса."));
}

// ── keyboard
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (fc && document.getElementById("flash")) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!fc.flip) { fc.flip = true; renderCard(); } }
    else if (fc.flip && e.key === "1") rate(false);
    else if (fc.flip && e.key === "2") rate(true);
    return;
  }
  if (!sess || sess.finished) return;
  const n = sess.items[sess.idx];
  if (/^[1-9]$/.test(e.key) && +e.key <= sess.opts[n].length) choose(+e.key - 1);
  else if (e.key === "Enter") { e.preventDefault(); const b = document.getElementById("checkBtn"); if (b && !b.disabled) submit(); else document.getElementById("nextBtn")?.click(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});

home();
})();
</script>
